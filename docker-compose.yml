# Local development: Postgres + API. Run `docker compose up --build`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repright
      POSTGRES_PASSWORD: repright
      POSTGRES_DB: repright
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repright -d repright"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: ./apps/api
    command: ["migrate", "up"]
    environment: &api-env
      DATABASE_URL: postgres://repright:repright@postgres:5432/repright?sslmode=disable
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./apps/api
    environment:
      <<: *api-env
      # Dev-only secret; production uses a random one (docs/DEPLOY.md).
      JWT_SECRET: dev-only-jwt-secret-change-me-0123456789
      # From the repo-root .env; sign-in fails without it.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
